# Reusable: plan + apply one environment behind its GitHub Environment gate (called by terraform.yml).
name: terraform-apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      terraform_version:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      # Until setup-github.ps1 has run for this environment there is nothing to apply with.
      - name: Environment configured?
        id: on
        working-directory: .
        env:
          ROLE: ${{ vars.TF_APPLY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$REGION" ]; then
            echo "::notice::$ENVIRONMENT has no TF_APPLY_ROLE_ARN / AWS_REGION variables yet (run scripts/setup-github.ps1) - apply skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.on.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.on.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - if: steps.on.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-apply-${{ github.run_id }}

      - if: steps.on.outputs.enabled == 'true'
        run: terraform init -no-color

      - name: plan
        if: steps.on.outputs.enabled == 'true'
        run: |
          terraform plan -no-color -lock-timeout=10m -out=tfplan | tee plan.txt
          { echo "### ${{ inputs.environment }}"; grep -E '^(Plan:|No changes\.)' plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: apply
        if: steps.on.outputs.enabled == 'true'
        run: terraform apply -no-color -lock-timeout=10m tfplan
