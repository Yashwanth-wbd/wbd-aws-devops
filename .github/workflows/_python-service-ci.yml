# Reusable CI for a Python component (api, optimizer, sagemaker-training, results-publisher).
# PR and main: lint, type-check, tests with a coverage gate, dependency + image scan.
# main only: push the scanned image as sha-<7char> to the dev ECR (deploy.yml picks it up).
# build_image = false (Lambda code): tests and dependency audit only; deploy.yml zips the code.
# Skipped while app_dir is absent (the app team has not added the code yet).
name: python-service-ci

on:
  workflow_call:
    inputs:
      app_dir:
        description: Service folder, e.g. apps/api
        type: string
        required: true
      repository:
        description: ECR repository, e.g. mmm/api (unused when build_image is false)
        type: string
        default: ""
      build_image:
        description: Build, scan and push a container image
        type: boolean
        default: true
      python_version:
        type: string
        default: "3.12"
      coverage_min:
        description: Minimum test coverage in percent
        type: number
        default: 80

permissions:
  contents: read

jobs:
  present:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      yes: ${{ steps.check.outputs.yes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: check
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          if [ -d "$APP_DIR" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::$APP_DIR not found - CI skipped"; echo "yes=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: present
    if: needs.present.outputs.yes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python_version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Tests (coverage gate ${{ inputs.coverage_min }} %)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=${{ inputs.coverage_min }}

      - name: Dependency audit (uv.lock, fixable Critical/High)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ vars.TRIVY_VERSION || 'v0.76.1' }}
          scan-type: fs
          scan-ref: ${{ inputs.app_dir }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build:
    needs: test
    if: inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build "${{ inputs.app_dir }}" \
            --tag "local/${{ inputs.repository }}:${{ steps.meta.outputs.tag }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - name: Image scan (block fixable Critical/High)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ vars.TRIVY_VERSION || 'v0.76.1' }}
          image-ref: local/${{ inputs.repository }}:${{ steps.meta.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image for the push job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "local/${{ inputs.repository }}:${{ steps.meta.outputs.tag }}" | gzip > "${RUNNER_TEMP}/image.tar.gz"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ steps.meta.outputs.tag }}
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1

  push:
    if: inputs.build_image && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ci-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push sha tag (immutable - skipped if it already exists)
        env:
          REPO: ${{ inputs.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids "imageTag=$TAG" > /dev/null 2>&1; then
            echo "$REPO:$TAG already in ECR"; exit 0
          fi
          gunzip -c "${RUNNER_TEMP}/image.tar.gz" | docker load
          docker tag "local/$REPO:$TAG" "$REGISTRY/$REPO:$TAG"
          docker push "$REGISTRY/$REPO:$TAG"
          echo "Pushed \`$REGISTRY/$REPO:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
