# Model governance: a retrained model becomes the approved version (its response curves are what
# the API serves) only after it passes data/model-thresholds.yaml AND a WBD approver approves it.
#
#   schedule (hourly) / dispatch evaluate -> evaluate every new PendingManualApproval version (gha-model-eval role)
#                                            pass -> tagged passed, a promote run is started per version
#                                            fail -> tagged failed and Rejected, warning; never approvable
#   dispatch promote  -> job waits in environment <env>-model-promotion (WBD approver) -> version Approved,
#                        curves copied to s3://<models bucket>/curves/<bu>/, drift baseline to
#                        baseline/<bu>/, approval.json written next to evaluation.json (gha-model-approve role)
#   dispatch rollback -> same approval -> previous approved version re-published (curves + baseline), current one Rejected
#
# Auth: GitHub OIDC to AWS - no secrets. Repository variables (per env, upper case, from the Terraform output
# github_repository_variables): MODEL_EVAL_ROLE_ARN_<ENV>, MODEL_APPROVE_ROLE_ARN_<ENV>, MODELS_BUCKET_<ENV>.
# Envs without MODEL_EVAL_ROLE_ARN_<ENV> (data platform off) are skipped.
name: model-governance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        type: choice
        options: [evaluate, promote, rollback]
        default: evaluate
      business_unit:
        description: "Business unit (evaluate: or all)"
        default: all
        required: true
      version:
        description: "Model package version (promote: required; rollback: optional, default previous_approved_version)"
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.t.outputs.environments }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          IN_ENV: ${{ inputs.environment }}
          VARS: ${{ toJSON(vars) }}
        run: |
          if [ "$EVENT" = schedule ]; then wanted='["dev","staging","prod"]'
          elif [ "$ACTION" = evaluate ]; then wanted="[\"$IN_ENV\"]"
          else wanted='[]'; fi
          envs=$(jq -c --argjson w "$wanted" '. as $v | [$w[] | select(($v["MODEL_EVAL_ROLE_ARN_" + ascii_upcase] // "") != "")]' <<< "$VARS")
          echo "environments=$envs" | tee -a "$GITHUB_OUTPUT"

  evaluate:
    needs: targets
    if: needs.targets.outputs.environments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.targets.outputs.environments) }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      BUSINESS_UNIT: ${{ inputs.business_unit || 'all' }}
      VERSION: ${{ inputs.action == 'evaluate' && inputs.version || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install --quiet -r scripts/requirements-model-governance.txt

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars[format('MODEL_EVAL_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: model-eval-${{ github.run_id }}

      - name: Evaluate candidates
        id: eval
        run: |
          args=(--environment "$ENVIRONMENT" --business-unit "$BUSINESS_UNIT" --report model-evaluation.json
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          python scripts/model_governance.py evaluate "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-evaluation-${{ matrix.environment }}-${{ github.run_id }}
          path: model-evaluation.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Request promotion of passed models (each waits for the WBD approver)
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ steps.eval.outputs.passed }}
        run: |
          jq -c '.[]' <<< "${PASSED:-[]}" | while read -r item; do
            bu=$(jq -r .business_unit <<< "$item"); v=$(jq -r .version <<< "$item")
            gh workflow run model-governance.yml --ref "$GITHUB_REF_NAME" -f environment="$ENVIRONMENT" \
              -f action=promote -f business_unit="$bu" -f version="$v"
            echo "promotion requested: $bu v$v -> approve in Actions (environment $ENVIRONMENT-model-promotion)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}-model-promotion
    # Per version, so a second pending approval for another version is never cancelled.
    concurrency:
      group: model-promotion-${{ inputs.environment }}-${{ inputs.business_unit }}-${{ inputs.action }}-${{ inputs.version || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      ROLE_ARN: ${{ vars[format('MODEL_APPROVE_ROLE_ARN_{0}', inputs.environment)] }}
      MODELS_BUCKET: ${{ vars[format('MODELS_BUCKET_{0}', inputs.environment)] }}
      BUSINESS_UNIT: ${{ inputs.business_unit }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check inputs
        run: |
          [ -n "$ROLE_ARN" ] || { echo "::error::repository variable MODEL_APPROVE_ROLE_ARN_${ENVIRONMENT^^} is not set"; exit 1; }
          [ -n "$MODELS_BUCKET" ] || { echo "::error::repository variable MODELS_BUCKET_${ENVIRONMENT^^} is not set"; exit 1; }
          [ "$BUSINESS_UNIT" != all ] || { echo "::error::$ACTION needs one business_unit"; exit 1; }
          [ "$ACTION" != promote ] || [ -n "$VERSION" ] || { echo "::error::promote needs a version"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install --quiet -r scripts/requirements-model-governance.txt

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: model-approve-${{ github.run_id }}

      - name: Approve or roll back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$ACTION" = promote ]; then
            approvers=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
              --jq '[.[] | select(.state == "approved") | .user.login] | join(",")' 2>/dev/null || echo "")
            python scripts/model_governance.py promote --environment "$ENVIRONMENT" --models-bucket "$MODELS_BUCKET" \
              --business-unit "$BUSINESS_UNIT" --version "$VERSION" --run-url "$run_url" --approved-by "${approvers:-unknown}"
          else
            args=(--environment "$ENVIRONMENT" --models-bucket "$MODELS_BUCKET" --business-unit "$BUSINESS_UNIT" --run-url "$run_url")
            [ -n "$VERSION" ] && args+=(--version "$VERSION")
            python scripts/model_governance.py rollback "${args[@]}"
          fi
