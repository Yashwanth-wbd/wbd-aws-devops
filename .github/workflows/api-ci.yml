name: api-ci

on:
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/api-ci.yml
      - .github/workflows/_python-service-ci.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/api-ci.yml
      - .github/workflows/_python-service-ci.yml
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_python-service-ci.yml
    with:
      app_dir: apps/api
      repository: mmm/api
