# Deploys the application components.
#
#   api-ci / ui-ci / optimizer-ci / training-ci / publisher-ci on main -> dev   (only the component that was built)
#   git tag vX.Y.Z-rcN -> staging  images copied from dev ECR,     tagged vX.Y.Z-rcN
#   git tag vX.Y.Z     -> prod     images copied from staging ECR, tagged vX.Y.Z (needs the rc on the same commit)
#   manual dispatch    -> redeploy an image already in that environment's ECR (rollback)
#
# Component        what a release changes                                    rollback
#   api, ui        new ECS task definition revision (api: migration first)    previous revision
#   optimizer      SSM /mmm/<env>/images/sagemaker-optimizer = image digest   previous value
#   training       SSM /mmm/<env>/images/sagemaker-training (data platform)   previous value
#   publisher      Lambda code -> new version -> alias "live"                  alias to previous version
# The state machines read the image parameters at the start of every execution, so running jobs
# are never changed. A component whose app folder is not in the commit is skipped.
#
# One job per run does everything after the approval gate: promote images -> (prod) RDS snapshot ->
# migration -> ECS -> smoke test -> SageMaker image pointers -> publisher -> optimization dry run
# through the run queue (dev/staging) -> release record.
# Any failure rolls every changed component back.
name: deploy

on:
  workflow_run:
    workflows: [api-ci, ui-ci, optimizer-ci, training-ci, publisher-ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image_tag:
        description: "Image tag already in that environment's ECR (dev: sha-<7char>, staging: vX.Y.Z-rcN, prod: vX.Y.Z). Empty = the tag you run this on."
        type: string
        required: false
      components:
        description: What to deploy
        type: choice
        options: [all, api, ui, optimizer, training, publisher]
        default: all
      run_migrations:
        description: Run DB migrations first (switch off when rolling back to an older version)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  resolve:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      version: ${{ steps.r.outputs.version }}
      commit: ${{ steps.r.outputs.commit }}
      components: ${{ steps.r.outputs.components }}
      promote: ${{ steps.r.outputs.promote }}
      migrations: ${{ steps.r.outputs.migrations }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_ENV: ${{ inputs.environment }}
          IN_TAG: ${{ inputs.image_tag }}
          IN_COMPONENTS: ${{ inputs.components }}
          IN_MIGRATIONS: ${{ inputs.run_migrations }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          rc='^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'
          rel='^v[0-9]+\.[0-9]+\.[0-9]+$'
          promote=false migrations=false
          case "$EVENT" in
            workflow_run)
              environment=dev commit="$RUN_SHA" version="sha-${RUN_SHA::7}"
              components="${RUN_NAME%-ci}"
              [ "$components" = api ] && migrations=true
              tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
                --jq '[.jobs[] | select((.name | endswith("test")) and .conclusion == "success")] | length')
              if [ "$tested" = 0 ]; then
                echo "::notice::$RUN_NAME built nothing (app folder absent) - nothing to deploy"; components=""
              fi ;;
            push)
              commit="$GITHUB_SHA" version="$REF_NAME" components=all migrations=true promote=true
              if   [[ "$REF_NAME" =~ $rc  ]]; then environment=staging
              elif [[ "$REF_NAME" =~ $rel ]]; then environment=prod
              else echo "::error::$REF_NAME is not vX.Y.Z-rcN or vX.Y.Z"; exit 1; fi ;;
            workflow_dispatch)
              environment="$IN_ENV" commit="$GITHUB_SHA" migrations="$IN_MIGRATIONS"
              components="$IN_COMPONENTS"
              if [ -n "$IN_TAG" ]; then version="$IN_TAG"
              elif [ "$environment" = dev ]; then version="sha-${GITHUB_SHA::7}"
              else version="$REF_NAME"; fi
              if [ "$environment" = prod ] && { [ "$REF_TYPE" != tag ] || ! [[ "$version" =~ $rel ]]; }; then
                echo "::error::prod only deploys release tags: run this workflow on a vX.Y.Z tag"; exit 1
              fi ;;
          esac
          [ "$components" = all ] && components="api ui optimizer training publisher"
          {
            echo "environment=$environment"; echo "version=$version"; echo "commit=$commit"
            echo "components=$components"; echo "promote=$promote"; echo "migrations=$migrations"
          } | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.components != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      VERSION: ${{ needs.resolve.outputs.version }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      COMPONENTS: ${{ needs.resolve.outputs.components }}
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Prepare
        env:
          REFRESH_SM: ${{ vars.MODEL_REFRESH_STATE_MACHINE_ARN }}
        run: |
          echo "STATE=$RUNNER_TEMP/deploy-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/deploy-state"
          prefix="${CLUSTER%-ecs}"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "SSM_PREFIX=/mmm/${prefix#mmm-}" >> "$GITHUB_ENV"
          [ -d "ecs/$ENVIRONMENT" ] || { echo "::error::ecs/$ENVIRONMENT templates missing"; exit 1; }
          components=""
          for c in $COMPONENTS; do
            read -r _ _ dir _ < <(scripts/deploy-components.sh "$c")
            if [ ! -d "$dir" ]; then echo "::notice::$c skipped: $dir is not in this commit"; continue; fi
            if [ "$c" = training ] && [ -z "$REFRESH_SM" ]; then echo "::notice::training skipped: data platform is off in $ENVIRONMENT"; continue; fi
            components="${components:+$components }$c"
          done
          echo "COMPONENTS=$components" >> "$GITHUB_ENV"
          echo "IMAGE_COMPONENTS=$(for c in $components; do [ "$(scripts/deploy-components.sh "$c" | cut -f1)" != lambda ] && printf '%s ' "$c"; done)" >> "$GITHUB_ENV"
          echo "Deploying: ${components:-nothing}"

      - name: Change ticket on the release tag (prod)
        if: needs.resolve.outputs.environment == 'prod' && github.event_name == 'push'
        env:
          # add actual value - WBD change-ticket format (ServiceNow CHG number assumed)
          PATTERN: ${{ vars.CHANGE_TICKET_PATTERN || 'CHG[0-9]{7}' }}
        run: |
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          msg=$(git tag -l --format='%(contents)' "$VERSION")
          ticket=$(grep -oE "$PATTERN" <<< "$msg" | head -n 1 || true)
          [ -n "$ticket" ] || { echo "::error::annotate the tag with the change ticket: git tag -a $VERSION -m \"<ticket> ...\""; exit 1; }
          echo "CHANGE_TICKET=$ticket" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- promotion (release tags)
      - name: Install skopeo
        if: needs.resolve.outputs.promote == 'true'
        run: command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

      - name: Source registry login (previous environment)
        if: needs.resolve.outputs.promote == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.SOURCE_ECR_READ_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-src-${{ github.run_id }}

      - name: Find source images
        if: needs.resolve.outputs.promote == 'true'
        env:
          SOURCE_REGISTRY: ${{ vars.SOURCE_ECR_REGISTRY }}
        run: |
          scripts/promote-images.sh login "$SOURCE_REGISTRY"
          if [ "$ENVIRONMENT" = prod ]; then
            git fetch --force --tags origin
            rc=$(scripts/promote-images.sh find-rc "$VERSION" "$COMMIT")
          fi
          : > "$STATE/sources.tsv"
          for c in $IMAGE_COMPONENTS; do
            read -r _ repo dir _ < <(scripts/deploy-components.sh "$c")
            if [ "$ENVIRONMENT" = prod ]; then src="$rc"; else src=$(scripts/promote-images.sh find-build "$repo" "$dir" "$COMMIT"); fi
            printf '%s\t%s\n' "$repo" "$src" >> "$STATE/sources.tsv"
          done
          cat "$STATE/sources.tsv"

      - name: Target registry login
        if: needs.resolve.outputs.promote == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-dst-${{ github.run_id }}

      - name: Copy images (same digest, no rebuild)
        if: needs.resolve.outputs.promote == 'true'
        env:
          SOURCE_REGISTRY: ${{ vars.SOURCE_ECR_REGISTRY }}
        run: |
          scripts/promote-images.sh login "$REGISTRY"
          while IFS=$'\t' read -r repo src <&3; do
            scripts/promote-images.sh copy "$SOURCE_REGISTRY/$repo:$src" "$REGISTRY/$repo:$VERSION" > /dev/null
          done 3< "$STATE/sources.tsv"

      # ---------------------------------------------------------------- deploy
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Check images and remember what is running
        env:
          PUBLISHER: ${{ vars.PUBLISHER_FUNCTION }}
        run: |
          : > "$STATE/services.tsv"; : > "$STATE/pointers.tsv"; : > "$STATE/digests.tsv"
          for c in $COMPONENTS; do
            read -r kind repo _ target < <(scripts/deploy-components.sh "$c")
            if [ "$kind" = lambda ]; then
              printf '%s\t%s\n' "$PUBLISHER" "$(scripts/lambda-release.sh current "$PUBLISHER")" > "$STATE/lambda.tsv"
              continue
            fi
            digest=$(scripts/ecs-deploy.sh digest "$repo" "$VERSION") || { echo "::error::$repo:$VERSION not in $REGISTRY"; exit 1; }
            printf '%s\t%s\n' "$repo" "$digest" >> "$STATE/digests.tsv"
            case "$kind" in
              ecs)       printf '%s\t%s\t%s\n' "$target" "$repo" "$(scripts/ecs-deploy.sh current "$CLUSTER" "$PREFIX-$target")" >> "$STATE/services.tsv" ;;
              sagemaker) printf '%s\t%s\t%s\n' "$SSM_PREFIX/images/$target" "$REGISTRY/$repo@$digest" \
                           "$(aws ssm get-parameter --name "$SSM_PREFIX/images/$target" --query Parameter.Value --output text)" >> "$STATE/pointers.tsv" ;;
            esac
          done
          column -t "$STATE/services.tsv" "$STATE/pointers.tsv" || true

      - name: RDS snapshot before migration (prod)
        if: needs.resolve.outputs.environment == 'prod' && needs.resolve.outputs.migrations == 'true' && contains(env.COMPONENTS, 'api')
        env:
          DB_INSTANCE_ID: ${{ vars.DB_INSTANCE_ID }}
        run: |
          id="$PREFIX-predeploy-${VERSION//./-}-${GITHUB_RUN_ID}"
          aws rds create-db-snapshot --db-instance-identifier "${DB_INSTANCE_ID:-$PREFIX-postgres}" --db-snapshot-identifier "$id" \
            --tags "Key=release,Value=$VERSION" "Key=github_run,Value=$GITHUB_RUN_ID" > /dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$id"
          echo "SNAPSHOT=$id" >> "$GITHUB_ENV"

      - name: Database migration
        if: needs.resolve.outputs.migrations == 'true' && contains(env.COMPONENTS, 'api')
        env:
          SUBNETS: ${{ vars.APP_SUBNET_IDS }}
          SG: ${{ vars.DATA_CLIENTS_SG_ID }}
        run: |
          td=$(scripts/ecs-deploy.sh render "ecs/$ENVIRONMENT/migrate.json" "$REGISTRY/mmm/api:$VERSION" "$VERSION")
          scripts/run-migration.sh "$CLUSTER" "$td" "$SUBNETS" "$SG"

      - name: Deploy ECS services
        id: services
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          while IFS=$'\t' read -r s repo previous <&3; do
            td=$(scripts/ecs-deploy.sh render "ecs/$ENVIRONMENT/$s.json" "$REGISTRY/$repo:$VERSION" "$VERSION")
            printf '%s\t%s\t%s\n' "$s" "$previous" "$td" >> "$STATE/deployed.tsv"
            scripts/ecs-deploy.sh update "$CLUSTER" "$PREFIX-$s" "$td"
          done 3< "$STATE/services.tsv"

      - name: Smoke test
        if: contains(env.COMPONENTS, 'api') || contains(env.COMPONENTS, 'ui')
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL || vars.APP_URL }}
          EXPECT: ${{ vars.SMOKE_CHECK_VERSION == 'true' && contains(needs.resolve.outputs.components, 'api') && needs.resolve.outputs.version || '' }}
          SMOKE_CHECK_LOGIN: ${{ vars.SMOKE_CHECK_LOGIN || 'true' }}
        run: scripts/smoke.sh "$BASE_URL" "$EXPECT"

      - name: SageMaker image pointers
        run: |
          while IFS=$'\t' read -r param image _ <&3; do
            aws ssm put-parameter --name "$param" --type String --overwrite --value "$image" > /dev/null
            echo "$param -> $image"
          done 3< "$STATE/pointers.tsv"

      - name: Results publisher
        if: contains(env.COMPONENTS, 'publisher')
        env:
          PUBLISHER: ${{ vars.PUBLISHER_FUNCTION }}
        run: |
          read -r _ _ dir _ < <(scripts/deploy-components.sh publisher)
          sha=$(scripts/lambda-release.sh build "$dir" "$RUNNER_TEMP/publisher.zip")
          echo "PUBLISHER_SHA256=$sha" >> "$GITHUB_ENV"
          new=$(scripts/lambda-release.sh publish "$PUBLISHER" "$RUNNER_TEMP/publisher.zip" "$VERSION")
          printf '\t%s\n' "$new" >> "$STATE/lambda.tsv"

      - name: Optimization dry run (dev, staging)
        if: >-
          needs.resolve.outputs.environment != 'prod' && vars.SMOKE_DRY_RUN != 'false' &&
          (contains(env.COMPONENTS, 'optimizer') || contains(env.COMPONENTS, 'publisher'))
        env:
          QUEUE_URL: ${{ vars.OPTIMIZATION_QUEUE_URL }}
          STATE_MACHINE: ${{ vars.OPTIMIZATION_STATE_MACHINE_ARN }}
          RESULTS_BUCKET: ${{ vars.RESULTS_BUCKET }}
          MODELS_BUCKET: ${{ vars.MODELS_BUCKET }}
          BUSINESS_UNIT: ${{ vars.DRY_RUN_BUSINESS_UNIT }}
        run: |
          scripts/dry-run-optimization.sh "$QUEUE_URL" "$STATE_MACHINE" "$RESULTS_BUCKET" "$MODELS_BUCKET" "$BUSINESS_UNIT" \
            "$SSM_PREFIX/images/sagemaker-optimizer"

      # ---------------------------------------------------------------- rollback
      - name: Roll back
        if: failure() && steps.services.outputs.started == 'true'
        run: |
          rc=0
          if [ -f "$STATE/deployed.tsv" ]; then
            while IFS=$'\t' read -r s previous _ <&3; do
              now=$(scripts/ecs-deploy.sh current "$CLUSTER" "$PREFIX-$s")
              [ "$now" = "$previous" ] && { echo "$s already on $previous"; continue; }
              scripts/ecs-deploy.sh update "$CLUSTER" "$PREFIX-$s" "$previous" || rc=1
            done 3< "$STATE/deployed.tsv"
          fi
          while IFS=$'\t' read -r param _ previous <&3; do
            aws ssm put-parameter --name "$param" --type String --overwrite --value "$previous" > /dev/null && echo "$param -> $previous" || rc=1
          done 3< "$STATE/pointers.tsv"
          if [ -f "$STATE/lambda.tsv" ]; then
            read -r fn previous < <(head -n 1 "$STATE/lambda.tsv" | tr -d '\n')
            scripts/lambda-release.sh switch "$fn" "$previous" || rc=1
          fi
          echo "::warning::Rolled back to the previous revisions. Migrations are not reverted (expand-then-contract)."
          exit $rc

      # ---------------------------------------------------------------- release record
      - name: Release record
        if: always() && needs.resolve.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          STATE="${STATE:-$RUNNER_TEMP/deploy-state}"; mkdir -p "$STATE"
          approvers=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | join(", ")' 2>/dev/null || echo "")
          jq -n --arg env "$ENVIRONMENT" --arg version "$VERSION" --arg commit "$COMMIT" --arg outcome "$OUTCOME" \
            --arg actor "$GITHUB_TRIGGERING_ACTOR" --arg approvers "${approvers:-none}" \
            --arg ticket "${CHANGE_TICKET:-}" --arg snapshot "${SNAPSHOT:-}" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg publisher_sha "${PUBLISHER_SHA256:-}" \
            --rawfile digests <(cat "$STATE/digests.tsv" 2>/dev/null || true) \
            --rawfile deployed <(cat "$STATE/deployed.tsv" 2>/dev/null || true) \
            --rawfile pointers <(cat "$STATE/pointers.tsv" 2>/dev/null || true) \
            --rawfile lambda <(tr -d '\n' < "$STATE/lambda.tsv" 2>/dev/null || true) '
            { environment: $env, version: $version, commit: $commit, outcome: $outcome,
              triggered_by: $actor, approved_by: $approvers, change_ticket: $ticket, db_snapshot: $snapshot, run: $run,
              images:   [$digests  | split("\n")[] | select(length > 0) | split("\t") | { repository: .[0], digest: .[1] }],
              services: [$deployed | split("\n")[] | select(length > 0) | split("\t") | { service: .[0], previous: .[1], deployed: .[2] }],
              sagemaker_images: [$pointers | split("\n")[] | select(length > 0) | split("\t") | { parameter: .[0], deployed: .[1], previous: .[2] }],
              publisher: (if ($lambda | length) > 0 then ($lambda | split("\t") | { function: .[0], previous: .[1], deployed: (.[2] // null), code_sha256: $publisher_sha }) else null end) }
          ' | tee "$STATE/release-record.json"
          {
            echo "### Deploy \`$VERSION\` to $ENVIRONMENT: $OUTCOME"
            echo; echo '```json'; cat "$STATE/release-record.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always() && needs.resolve.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-record-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/deploy-state/release-record.json
          retention-days: 90
          if-no-files-found: ignore
