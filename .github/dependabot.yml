# Weekly dependency and monthly base-image update PRs (docs/13 §2). The app teams add their
# folders (apps/api, apps/ui, apps/optimizer, apps/sagemaker-training,
# apps/results-publisher) and data/glue/jobs (pip, if it gets a requirements.txt) here once they are in the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
