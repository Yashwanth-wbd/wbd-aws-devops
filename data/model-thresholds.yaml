# Week-1 acceptance thresholds for retrained media-mix models (scripts/model_governance.py).
# A model package is approved only if EVERY metric passes AND the named WBD approver approves the
# <env>-model-promotion GitHub Environment. A metric missing from evaluation.json fails the check.
# Placeholder values until WBD and EY sign them off (docs/01).

# SageMaker model package group per business unit; {prefix} = mmm-<env_short>, {business_unit} = key below
model_package_group: "{prefix}-{business_unit}"

# The evaluation job writes <evaluation prefix>/evaluation.json ({"metric": value, ...}) and
# <evaluation prefix>/curves/ (response curves). Approval copies the curves to s3://<models bucket>/curves/<bu>/.
curves_prefix: "curves/{business_unit}/"

# Approval also publishes the drift baseline: <evaluation prefix>/baseline/ -> s3://<models bucket>/baseline/<bu>/
# (read by the model-monitor drift check). drift.threshold per business unit overrides
# model_drift_threshold (tfvars); Terraform reads it, so a change needs a terraform apply.
baseline_prefix: "baseline/{business_unit}/"

business_units:
  usnetworks:
    metrics:
      # add actual value
      holdout_mape: { max: 0.15 }
      # add actual value
      r_squared: { min: 0.80 }
      # add actual value
      max_rhat: { max: 1.05 }
      # add actual value
      negative_contribution_channels: { max: 0 }
    # Daily drift check (model-monitor): alarm when the drift score (0-1) is above this
    drift:
      # add actual value
      threshold: 0.2
  streaming:
    metrics:
      # add actual value
      holdout_mape: { max: 0.15 }
      # add actual value
      r_squared: { min: 0.80 }
      # add actual value
      max_rhat: { max: 1.05 }
      # add actual value
      negative_contribution_channels: { max: 0 }
    # Daily drift check (model-monitor): alarm when the drift score (0-1) is above this
    drift:
      # add actual value
      threshold: 0.2
  theatrical:
    metrics:
      # add actual value
      holdout_mape: { max: 0.20 }
      # add actual value
      r_squared: { min: 0.75 }
      # add actual value
      max_rhat: { max: 1.05 }
      # add actual value
      negative_contribution_channels: { max: 0 }
    # Daily drift check (model-monitor): alarm when the drift score (0-1) is above this
    drift:
      # add actual value
      threshold: 0.2
